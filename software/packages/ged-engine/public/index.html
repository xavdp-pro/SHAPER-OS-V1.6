<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shaper OS — Explorateur Mini-GED</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            panel: '#090e1a',
            sidebar: '#0d1322',
            card: '#131b2e',
            cardHover: '#18233c',
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

</head>
<body class="bg-[#050811] text-slate-200 min-h-screen flex flex-col font-sans antialiased selection:bg-cyan-500/30">

    <symbol id="icon-file-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></symbol>

    <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
    <symbol id="icon-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></symbol>
    <symbol id="icon-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></symbol>

  <!-- Top Navigation Bar -->
  <header class="border-b border-white/10 bg-panel/95 backdrop-blur sticky top-0 z-30 px-3 py-2 sm:px-4 sm:py-2.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 sm:gap-4">
      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <button id="btnToggleMobileSidebar" class="p-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300 md:hidden border border-white/10 shrink-0" title="Dossiers & Tags">
          <svg class="w-4 h-4"><use href="#icon-menu"/></svg>
        </button>
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-600 flex items-center justify-center shadow-md shadow-cyan-500/20 text-white shrink-0">
          <svg class="w-4 h-4"><use href="#icon-folder"/></svg>
        </div>
        <div class="min-w-0">
          <h1 class="text-xs sm:text-sm font-bold text-white flex items-center gap-1.5 truncate">
            Mini-GED <span class="text-[9px] sm:text-[10px] px-1.5 py-0.2 rounded bg-cyan-500/10 text-cyan-400 font-mono border border-cyan-500/20 shrink-0">Explorateur</span>
          </h1>
          <p class="text-[10px] sm:text-[11px] text-slate-400 hidden sm:block truncate">Hub Documentaire Souverain (/data/ged)</p>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button id="btnNewFolder" class="px-2 py-1.5 sm:px-2.5 sm:py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-slate-200 transition text-xs font-medium flex items-center gap-1.5 border border-white/10" title="Créer un sous-dossier">
          <svg class="w-3.5 h-3.5 text-cyan-400"><use href="#icon-folder-plus"/></svg>
          <span class="hidden sm:inline">Nouveau dossier</span>
        </button>
        <button id="btnRefresh" class="p-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300 transition text-xs flex items-center gap-1 border border-white/10" title="Actualiser la vue">
          <svg class="w-3.5 h-3.5"><use href="#icon-refresh"/></svg>
        </button>
        <a href="https://ia.szde.fr" target="_blank" class="px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-lg bg-cyan-600/20 hover:bg-cyan-600/30 text-cyan-300 border border-cyan-500/30 transition text-xs font-medium flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5"><use href="#icon-chat"/></svg>

      </div>
    </div>
  </header>

  <!-- Workspace: Sidebar (Folders + Tags) & Main File Explorer -->
  <div class="max-w-7xl mx-auto w-full flex-1 flex flex-col md:flex-row gap-4 p-3 sm:p-4">

    <!-- 1. Left Sidebar: Folder Tree & Color Tags (GNOME / Thunar style) -->
    <aside id="sidebar" class="hidden md:flex w-full md:w-64 shrink-0 bg-sidebar border border-white/10 rounded-2xl p-3 flex-col gap-4 shadow-xl">
      <!-- Folders Header -->
      <div>
        <div class="flex items-center justify-between text-xs font-semibold text-slate-400 uppercase tracking-wider px-2 mb-2">
          <span>Arborescence</span>
          <button id="btnSidebarNewFolder" class="text-cyan-400 hover:text-cyan-300 text-sm font-bold" title="Ajouter un dossier">+</button>
        </div>
        <div id="folderTree" class="space-y-1 text-xs">
          <button data-folder="" class="folder-nav-item active w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg bg-cyan-500/20 text-cyan-300 font-medium transition text-left border border-cyan-500/30">
            <span class="flex items-center gap-2 truncate">
              <svg class="w-4 h-4 text-cyan-400 shrink-0"><use href="#icon-folder"/></svg>
              <span>Tous les documents</span>
            </span>
            <span id="badgeCountAll" class="text-[10px] px-1.5 py-0.5 rounded bg-white/10 text-slate-300">0</span>
          </button>
        </div>
      </div>

      <!-- Color Tags (GNOME Files / macOS Finder Labels) -->
      <div class="border-t border-white/10 pt-3">
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-2 mb-2">
          <span>Étiquettes / Tags</span>
        </div>
        <div class="space-y-1 text-xs" id="tagFilters">
          <button data-tag="all" class="tag-nav-item active w-full flex items-center gap-2 px-2.5 py-1.5 rounded-lg bg-white/5 text-slate-200 hover:bg-white/10 transition text-left">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
            <span>Toutes les étiquettes</span>
          </button>
          <button data-tag="urgent" class="tag-nav-item w-full flex items-center gap-2 px-2.5 py-1.5 rounded-lg hover:bg-white/10 text-slate-300 transition text-left">
            <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
            <span>Urgent / À traiter</span>
          </button>
          <button data-tag="valid" class="tag-nav-item w-full flex items-center gap-2 px-2.5 py-1.5 rounded-lg hover:bg-white/10 text-slate-300 transition text-left">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
            <span>Signé / Validé</span>
          </button>
          <button data-tag="compta" class="tag-nav-item w-full flex items-center gap-2 px-2.5 py-1.5 rounded-lg hover:bg-white/10 text-slate-300 transition text-left">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
            <span>Facturation / Compta</span>
          </button>
          <button data-tag="review" class="tag-nav-item w-full flex items-center gap-2 px-2.5 py-1.5 rounded-lg hover:bg-white/10 text-slate-300 transition text-left">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
            <span>En attente / Devis</span>
          </button>
          <button data-tag="archive" class="tag-nav-item w-full flex items-center gap-2 px-2.5 py-1.5 rounded-lg hover:bg-white/10 text-slate-300 transition text-left">
            <span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span>
            <span>Archives & Légal</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- 2. Main Explorer Area -->
    <main class="flex-1 flex flex-col gap-3 sm:gap-4 min-w-0">

      <!-- Breadcrumbs & Search Bar -->
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5 bg-panel border border-white/10 rounded-2xl p-3 shadow-lg">
        <!-- Breadcrumb Navigation -->
        <nav class="flex items-center gap-1.5 text-xs text-slate-300 overflow-x-auto" id="breadcrumbs">
          <button data-target="" class="breadcrumb-btn hover:text-cyan-400 flex items-center gap-1 font-semibold">
            <svg class="w-3.5 h-3.5 text-cyan-400"><use href="#icon-folder"/></svg>
            <span>GED</span>
          </button>
        </nav>

        <!-- Search & Layout Toggle -->
        <div class="flex items-center gap-2">
          <div class="relative flex-1 sm:w-56">
            <input type="text" id="searchInput" placeholder="Rechercher..." class="w-full bg-card border border-white/10 rounded-xl px-3 py-1.5 pl-8 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500">
            <svg class="w-3.5 h-3.5 text-slate-500 absolute left-2.5 top-2"><use href="#icon-search"/></svg>
          </div>
          <button id="btnToggleLayout" class="p-2 rounded-xl bg-card border border-white/10 hover:bg-white/10 text-slate-300 text-xs" title="Grille / Liste">
            <svg class="w-3.5 h-3.5" id="layoutIcon"><use href="#icon-list"/></svg>
          </button>
        </div>
      </div>

      <!-- Dropzone (Drag & Drop files into active folder) -->
      <div id="dropzone" class="border-2 border-dashed border-white/15 hover:border-cyan-500/50 bg-panel/40 hover:bg-panel/70 transition-all rounded-2xl p-3 sm:p-5 text-center cursor-pointer relative overflow-hidden group">
        <input type="file" id="fileInput" multiple class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10">
        <div class="flex items-center justify-center gap-3">
          <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-cyan-500/10 group-hover:bg-cyan-500/20 text-cyan-400 flex items-center justify-center transition shrink-0">
            <svg class="w-4 h-4 sm:w-5 sm:h-5"><use href="#icon-upload"/></svg>
          </div>
          <div class="text-left min-w-0">
            <div class="text-xs font-semibold text-slate-200 truncate">
              Glissez vos fichiers ici ou <span class="text-cyan-400 underline">parcourir</span>
            </div>
            <p class="text-[10px] sm:text-[11px] text-slate-500 truncate">PDFs, Factures, Devis, Tableurs, Images</p>
          </div>
        </div>
        <div id="uploadProgress" class="hidden mt-3 max-w-md mx-auto">
          <div class="flex justify-between text-[11px] text-slate-400 mb-1">
            <span id="uploadStatusText">Envoi en cours...</span>

          <div class="w-full bg-white/10 rounded-full h-1.5 overflow-hidden">
            <div id="uploadBar" class="bg-cyan-500 h-1.5 rounded-full transition-all duration-200" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <!-- Category Filter Pills -->
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs" id="filterTabs">
        <button data-cat="all" class="cat-btn active px-3 py-1 rounded-lg font-medium bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 shrink-0">Tous</button>
        <button data-cat="pdf" class="cat-btn px-3 py-1 rounded-lg font-medium bg-white/5 text-slate-400 hover:text-white border border-white/5 shrink-0">PDFs</button>
        <button data-cat="spreadsheet" class="cat-btn px-3 py-1 rounded-lg font-medium bg-white/5 text-slate-400 hover:text-white border border-white/5 shrink-0">Tableurs</button>
        <button data-cat="document" class="cat-btn px-3 py-1 rounded-lg font-medium bg-white/5 text-slate-400 hover:text-white border border-white/5 shrink-0">Documents</button>
        <button data-cat="image" class="cat-btn px-3 py-1 rounded-lg font-medium bg-white/5 text-slate-400 hover:text-white border border-white/5 shrink-0">Images</button>
        <button data-cat="archive" class="cat-btn px-3 py-1 rounded-lg font-medium bg-white/5 text-slate-400 hover:text-white border border-white/5 shrink-0">Archives</button>
      </div>

      <!-- File Grid / List View Container -->
      <div id="filesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        <!-- Dynamic Cards rendered here -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-12 sm:py-16 bg-panel/30 border border-white/5 rounded-2xl">
        <div class="w-12 h-12 rounded-full bg-white/5 text-slate-500 mx-auto flex items-center justify-center mb-3">
          <svg class="w-6 h-6"><use href="#icon-folder"/></svg>
        </div>
        <p class="text-sm font-medium text-slate-400">Aucun document dans ce dossier.</p>
        <p class="text-xs text-slate-600 mt-1">Glissez des fichiers pour commencer l'archivage.</p>
      </div>

    </main>
  </div>

  <script>
    // Robust Base URL Resolver (direct /api or proxied /api/ged)
    const API_BASE = window.location.pathname.startsWith('/ged') ? '/api/ged' : '/api';

    // State
    let allFiles = [];
    let allFolders = [];
    let currentFolder = '';
    let currentCategory = 'all';
    let currentTag = 'all';
    let searchQuery = '';
    let isGridView = true;

    const TAG_MAP = {
      urgent: { label: 'Urgent', color: '#ef4444', bg: 'bg-red-500/20 text-red-300 border-red-500/40' },
      valid: { label: 'Validé', color: '#10b981', bg: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' },
      compta: { label: 'Compta', color: '#3b82f6', bg: 'bg-blue-500/20 text-blue-300 border-blue-500/40' },
      review: { label: 'Devis', color: '#f59e0b', bg: 'bg-amber-500/20 text-amber-300 border-amber-500/40' },
      archive: { label: 'Archive', color: '#8b5cf6', bg: 'bg-purple-500/20 text-purple-300 border-purple-500/40' },
    };

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 o';
      const k = 1024;
      const dm = 1;
      const sizes = ['o', 'Ko', 'Mo', 'Go'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function formatDate(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function getCategoryIcon(cat) {
      switch(cat) {
        case 'pdf': return 'icon-file-text';
        case 'spreadsheet': return 'icon-file-spreadsheet';
        case 'document': return 'icon-file-text';
        case 'image': return 'icon-image';
        case 'archive': return 'icon-archive';
        default: return 'icon-file';
      }
    }

    function getCategoryColorClass(cat) {
      switch(cat) {
        case 'pdf': return 'from-red-500/20 to-orange-500/10 text-red-400 border-red-500/30';
        case 'spreadsheet': return 'from-emerald-500/20 to-teal-500/10 text-emerald-400 border-emerald-500/30';
        case 'document': return 'from-blue-500/20 to-cyan-500/10 text-blue-400 border-blue-500/30';
        case 'image': return 'from-purple-500/20 to-pink-500/10 text-purple-400 border-purple-500/30';
        case 'archive': return 'from-amber-500/20 to-yellow-500/10 text-amber-400 border-amber-500/30';
        default: return 'from-slate-500/20 to-slate-600/10 text-slate-400 border-slate-500/30';
      }
    }

    async function loadData() {
      try {
        let resFiles = await fetch(`${API_BASE}/files`).then(r => r.json()).catch(() => ({ ok: false }));
        let resFolders = await fetch(`${API_BASE}/folders`).then(r => r.json()).catch(() => ({ ok: false }));

        // Fallback to direct /api if /api/ged was unavailable
        if (!resFiles.ok && API_BASE !== '/api') {
          resFiles = await fetch('/api/files').then(r => r.json()).catch(() => ({ ok: false }));
          resFolders = await fetch('/api/folders').then(r => r.json()).catch(() => ({ ok: false }));
        }

        if (resFiles && resFiles.ok) allFiles = resFiles.files || [];
        if (resFolders && resFolders.ok) allFolders = resFolders.folders || [];

        renderFolderTree();
        renderBreadcrumbs();
        renderFiles();
      } catch (err) {
        console.error('Erreur chargement données GED:', err);
      }
    }

    function renderFolderTree() {
      const treeEl = document.getElementById('folderTree');
      document.getElementById('badgeCountAll').innerText = allFiles.length;

      let html = `
        <button data-folder="" class="folder-nav-item w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg ${currentFolder === '' ? 'bg-cyan-500/20 text-cyan-300 font-medium border border-cyan-500/30' : 'text-slate-400 hover:bg-white/5 hover:text-slate-200'} transition text-left">
          <span class="flex items-center gap-2 truncate">
            <svg class="w-4 h-4 text-cyan-400 shrink-0"><use href="#icon-folder"/></svg>
            <span>Tous les documents</span>
          </span>
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-white/10 text-slate-300">${allFiles.length}</span>
        </button>
      `;

      allFolders.forEach(folder => {
        const count = allFiles.filter(f => f.folder === folder || f.folder.startsWith(folder + '/')).length;
        const isActive = currentFolder === folder;
        html += `
          <button data-folder="${folder}" class="folder-nav-item w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg ${isActive ? 'bg-cyan-500/20 text-cyan-300 font-medium border border-cyan-500/30' : 'text-slate-400 hover:bg-white/5 hover:text-slate-200'} transition text-left"
            ondragover="event.preventDefault(); this.classList.add('folder-drop-active');"
            ondragleave="this.classList.remove('folder-drop-active');"
            ondrop="handleDropOnFileFolder(event, '${folder}')">
            <span class="flex items-center gap-2 truncate">
              <svg class="w-4 h-4 text-amber-400 shrink-0"><use href="#icon-folder"/></svg>
              <span class="truncate">${folder}</span>
            </span>
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-white/10 text-slate-300">${count}</span>
          </button>
        `;
      });

      treeEl.innerHTML = html;

      treeEl.querySelectorAll('.folder-nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
          currentFolder = btn.getAttribute('data-folder');
          renderFolderTree();
          renderBreadcrumbs();
          renderFiles();
          if (window.innerWidth < 768) {
            document.getElementById('sidebar').classList.add('hidden');
          }
        });
      });
    }

    function renderBreadcrumbs() {
      const bcEl = document.getElementById('breadcrumbs');
      if (!currentFolder) {
        bcEl.innerHTML = `
          <button data-target="" class="breadcrumb-btn text-cyan-300 font-semibold flex items-center gap-1">
            <svg class="w-3.5 h-3.5 text-cyan-400"><use href="#icon-folder"/></svg>
            <span>GED (Racine)</span>
          </button>
        `;
        return;
      }

      const parts = currentFolder.split('/');
      let accumulated = '';
      let html = `
        <button data-target="" class="breadcrumb-btn text-slate-400 hover:text-cyan-400 flex items-center gap-1">
          <svg class="w-3.5 h-3.5 text-slate-400"><use href="#icon-folder"/></svg>
          <span>GED</span>
        </button>
      `;

      parts.forEach((part, idx) => {
        accumulated = accumulated ? `${accumulated}/${part}` : part;
        const isLast = idx === parts.length - 1;
        html += `
          <svg class="w-3 h-3 text-slate-600 shrink-0"><use href="#icon-chevron-right"/></svg>
          <button data-target="${accumulated}" class="breadcrumb-btn ${isLast ? 'text-cyan-300 font-semibold' : 'text-slate-400 hover:text-cyan-400'} truncate max-w-[120px]">
            ${part}
          </button>
        `;
      });

      bcEl.innerHTML = html;
      bcEl.querySelectorAll('.breadcrumb-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentFolder = btn.getAttribute('data-target');
          renderFolderTree();
          renderBreadcrumbs();
          renderFiles();
        });
      });
    }

    function renderFiles() {
      const container = document.getElementById('filesContainer');
      const emptyState = document.getElementById('emptyState');

      let list = [...allFiles];

      // Folder filter
      if (currentFolder) {
        list = list.filter(f => f.folder === currentFolder || f.folder.startsWith(currentFolder + '/'));
      }

      // Category filter
      if (currentCategory !== 'all') {
        list = list.filter(f => f.category === currentCategory);
      }

      // Tag filter
      if (currentTag !== 'all') {
        list = list.filter(f => f.tag === currentTag);
      }

      // Search filter
      if (searchQuery) {
        list = list.filter(f => f.name.toLowerCase().includes(searchQuery) || (f.conversationName && f.conversationName.toLowerCase().includes(searchQuery)));
      }

      if (list.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      if (isGridView) {
        container.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3";
        container.innerHTML = list.map(f => {
          const iconId = getCategoryIcon(f.category);
          const colorClass = getCategoryColorClass(f.category);
          const tagInfo = TAG_MAP[f.tag];

          return `
            <div class="bg-card hover:bg-cardHover border border-white/10 hover:border-cyan-500/40 rounded-2xl p-3.5 sm:p-4 transition-all duration-200 shadow-md flex flex-col justify-between group relative"
                 draggable="true" ondragstart="event.dataTransfer.setData('text/plain', '${f.relPath}')">
              
              <div>
                <div class="flex items-start justify-between gap-2 mb-2">
                  <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br ${colorClass} border flex items-center justify-center shrink-0 shadow-inner">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5"><use href="#${iconId}"/></svg>
                  </div>
                  
                  <div class="flex items-center gap-1">
                    <!-- Color Tag Selector Button -->
                    <div class="relative group/tag">
                      <button class="p-1 rounded-md hover:bg-white/10 text-slate-400 hover:text-white" title="Attribuer un tag / couleur">
                        <span class="w-2.5 h-2.5 rounded-full inline-block ${tagInfo ? '' : 'bg-slate-600'}" style="${tagInfo ? `background-color: ${tagInfo.color}` : ''}"></span>
                      </button>
                      <div class="hidden group-hover/tag:flex absolute right-0 top-6 z-20 bg-panel border border-white/15 p-1 rounded-lg shadow-xl gap-1">
                        <button onclick="setFileTag('${f.relPath}', '')" class="w-4 h-4 rounded-full bg-slate-600 border border-white/20" title="Aucun"></button>
                        <button onclick="setFileTag('${f.relPath}', 'urgent')" class="w-4 h-4 rounded-full bg-red-500" title="Urgent"></button>
                        <button onclick="setFileTag('${f.relPath}', 'valid')" class="w-4 h-4 rounded-full bg-emerald-500" title="Validé"></button>
                        <button onclick="setFileTag('${f.relPath}', 'compta')" class="w-4 h-4 rounded-full bg-blue-500" title="Compta"></button>
                        <button onclick="setFileTag('${f.relPath}', 'review')" class="w-4 h-4 rounded-full bg-amber-500" title="Devis"></button>
                        <button onclick="setFileTag('${f.relPath}', 'archive')" class="w-4 h-4 rounded-full bg-purple-500" title="Archive"></button>
                      </div>
                    </div>

                    <button onclick="deleteFile('${f.id}', '${f.name}')" class="p-1 rounded-md hover:bg-red-500/20 text-slate-500 hover:text-red-400 transition" title="Supprimer">
                      <svg class="w-3.5 h-3.5"><use href="#icon-trash"/></svg>
                    </button>
                  </div>
                </div>

                <h3 class="text-xs font-semibold text-white truncate mb-1" title="${f.name}">${f.name}</h3>
                <div class="flex items-center gap-2 text-[10px] sm:text-[11px] text-slate-400 mb-2">
                  <span>${formatBytes(f.size)}</span>
                  <span>•</span>
                  <span>${formatDate(f.mtime)}</span>
                </div>

                <!-- Provenance & Tag Badges -->
                <div class="flex flex-wrap gap-1.5 mb-3">
                  ${f.conversationName ? `
                    <span class="inline-flex items-center gap-1 text-[9px] sm:text-[10px] px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-300 border border-cyan-500/20 font-medium truncate max-w-[180px]" title="Origine : ${f.conversationName}">
                      <svg class="w-2.5 h-2.5 text-cyan-400 shrink-0"><use href="#icon-chat"/></svg>
                      <span class="truncate">${f.conversationName}</span>
                    </span>
                  ` : ''}
                  ${tagInfo ? `
                    <span class="inline-flex items-center gap-1 text-[9px] sm:text-[10px] px-2 py-0.5 rounded-full ${tagInfo.bg} border font-medium">
                      <span class="w-1.5 h-1.5 rounded-full" style="background-color: ${tagInfo.color}"></span>
                      <span>${tagInfo.label}</span>
                    </span>
                  ` : ''}
                </div>
              </div>

              <!-- Action Links -->
              <div class="flex items-center justify-between border-t border-white/5 pt-2.5 mt-1 text-xs">
                <span class="text-[10px] font-mono text-slate-500 uppercase">${f.ext.replace('.', '')}</span>
                <div class="flex items-center gap-1.5">
                  <a href="${API_BASE}/files/${f.id}/preview" target="_blank" class="px-2 py-1 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white transition flex items-center gap-1 text-[11px]">
                    <svg class="w-3 h-3"><use href="#icon-eye"/></svg>
                    <span>Voir</span>
                  </a>
                  <a href="${API_BASE}/files/${f.id}/download" class="px-2 py-1 rounded-lg bg-cyan-600/20 hover:bg-cyan-600/30 text-cyan-300 border border-cyan-500/30 transition flex items-center gap-1 text-[11px]">
                    <svg class="w-3 h-3"><use href="#icon-download"/></svg>
                    <span>Télécharger</span>
                  </a>
                </div>
              </div>

            </div>
          `;
        }).join('');
      } else {
        // Table / List View
        container.className = "flex flex-col gap-1.5";
        container.innerHTML = `
          <div class="bg-panel border border-white/10 rounded-2xl overflow-x-auto shadow-lg">
            <table class="w-full text-left text-xs text-slate-300 min-w-[500px]">
              <thead class="bg-white/5 text-slate-400 text-[11px] uppercase tracking-wider border-b border-white/10">
                <tr>
                  <th class="p-3">Nom</th>
                  <th class="p-3">Dossier</th>
                  <th class="p-3">Origine</th>
                  <th class="p-3">Tag</th>
                  <th class="p-3">Taille</th>
                  <th class="p-3">Date</th>
                  <th class="p-3 text-right">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-white/5">
                ${list.map(f => {
                  const tagInfo = TAG_MAP[f.tag];
                  return `
                    <tr class="hover:bg-white/5 transition">
                      <td class="p-3 flex items-center gap-2 font-medium text-white">
                        <svg class="w-4 h-4 text-cyan-400 shrink-0"><use href="#${getCategoryIcon(f.category)}"/></svg>
                        <span class="truncate max-w-[160px]" title="${f.name}">${f.name}</span>
                      </td>
                      <td class="p-3 text-slate-400">${f.folder || '/'}</td>
                      <td class="p-3">
                        ${f.conversationName ? `<span class="text-[10px] px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-300 border border-cyan-500/20">${f.conversationName}</span>` : '-'}
                      </td>
                      <td class="p-3">
                        ${tagInfo ? `<span class="text-[10px] px-2 py-0.5 rounded-full ${tagInfo.bg}">${tagInfo.label}</span>` : '-'}
                      </td>
                      <td class="p-3 text-slate-400">${formatBytes(f.size)}</td>
                      <td class="p-3 text-slate-400">${formatDate(f.mtime)}</td>
                      <td class="p-3 text-right">
                        <div class="flex items-center justify-end gap-1">
                          <a href="${API_BASE}/files/${f.id}/preview" target="_blank" class="p-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300"><svg class="w-3.5 h-3.5"><use href="#icon-eye"/></svg></a>
                          <a href="${API_BASE}/files/${f.id}/download" class="p-1.5 rounded-lg bg-cyan-600/20 hover:bg-cyan-600/30 text-cyan-300"><svg class="w-3.5 h-3.5"><use href="#icon-download"/></svg></a>
                          <button onclick="deleteFile('${f.id}', '${f.name}')" class="p-1.5 rounded-lg hover:bg-red-500/20 text-slate-500 hover:text-red-400"><svg class="w-3.5 h-3.5"><use href="#icon-trash"/></svg></button>
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }
    }

    async function setFileTag(relPath, tag) {
      try {
        await fetch(`${API_BASE}/tag`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ relPath, tag }),
        });
        loadData();
      } catch (err) {
        console.error('Erreur setFileTag:', err);
      }
    }

    async function handleDropOnFileFolder(e, targetFolder) {
      e.preventDefault();
      e.currentTarget.classList.remove('folder-drop-active');
      const fromRel = e.dataTransfer.getData('text/plain');
      if (fromRel) {
        try {
          await fetch(`${API_BASE}/move`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ from: fromRel, toFolder: targetFolder }),
          });
          loadData();
        } catch (err) {
          console.error('Erreur déplacement fichier:', err);
        }
      }
    }

    async function deleteFile(id, name) {
      if (!confirm(`Supprimer définitivement "${name}" ?`)) return;
      try {
        await fetch(`${API_BASE}/files/${id}`, { method: 'DELETE' });
        loadData();
      } catch (err) {
        alert('Erreur lors de la suppression');
      }
    }

    async function createNewFolder() {
      const name = prompt('Nom du nouveau dossier :');
      if (!name || !name.trim()) return;
      const clean = name.trim().replace(/[/\\?%*:|"<>]/g, '-');
      const full = currentFolder ? `${currentFolder}/${clean}` : clean;
      try {
        await fetch(`${API_BASE}/folders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ folder: full }),
        });
        currentFolder = full;
        loadData();
      } catch (err) {
        alert('Erreur création dossier');
      }
    }

    // Event Listeners
    document.getElementById('btnRefresh').addEventListener('click', loadData);
    document.getElementById('btnNewFolder').addEventListener('click', createNewFolder);
    document.getElementById('btnSidebarNewFolder').addEventListener('click', createNewFolder);

    document.getElementById('btnToggleMobileSidebar').addEventListener('click', () => {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('hidden');
      sb.classList.toggle('flex');
    });

    document.getElementById('btnToggleLayout').addEventListener('click', () => {
      isGridView = !isGridView;
      document.getElementById('layoutIcon').innerHTML = `<use href="#${isGridView ? 'icon-list' : 'icon-grid'}"/>`;
      renderFiles();
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderFiles();
    });

    // Category Tabs
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => {
          b.classList.remove('active', 'bg-cyan-500/20', 'text-cyan-300', 'border-cyan-500/30');
          b.classList.add('bg-white/5', 'text-slate-400');
        });
        btn.classList.add('active', 'bg-cyan-500/20', 'text-cyan-300', 'border-cyan-500/30');
        btn.classList.remove('bg-white/5', 'text-slate-400');
        currentCategory = btn.getAttribute('data-cat');
        renderFiles();
      });
    });

    // Tag Filters
    document.querySelectorAll('.tag-nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tag-nav-item').forEach(b => {
          b.classList.remove('active', 'bg-white/10', 'text-white');
          b.classList.add('text-slate-300');
        });
        btn.classList.add('active', 'bg-white/10', 'text-white');
        currentTag = btn.getAttribute('data-tag');
        renderFiles();
      });
    });

    // File Upload Handler
    const fileInput = document.getElementById('fileInput');
    const uploadProgress = document.getElementById('uploadProgress');
    const uploadBar = document.getElementById('uploadBar');
    const uploadStatusText = document.getElementById('uploadStatusText');
    const uploadPercent = document.getElementById('uploadPercent');

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      uploadProgress.classList.remove('hidden');
      let completed = 0;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        uploadStatusText.innerText = `Envoi de ${file.name} (${i + 1}/${files.length})...`;
        const pct = Math.round((i / files.length) * 100);
        uploadBar.style.width = `${pct}%`;
        uploadPercent.innerText = `${pct}%`;

        try {
          await fetch(`${API_BASE}/upload?filename=${encodeURIComponent(file.name)}&folder=${encodeURIComponent(currentFolder)}`, {
            method: 'POST',
            body: file,
          });
        } catch (err) {
          console.error(`Erreur envoi ${file.name}:`, err);
        }
      }

      uploadBar.style.width = '100%';
      uploadPercent.innerText = '100%';
      uploadStatusText.innerText = 'Téléversement terminé !';
      setTimeout(() => uploadProgress.classList.add('hidden'), 1500);

      fileInput.value = '';
      loadData();
    });

    // Initial Load
    loadData();
  </script>
</body>
</html>
